ج<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>أبوسلمي</title>
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. The landing page may use the
         shared stylesheet; this one may not. -->
    <style>
      :root {
        --bg: #000000;
        --panel: rgba(10, 15, 12, 0.85);
        --sunk: rgba(5, 10, 7, 0.9);
        --line: #ffd209;
        --fg: #c8ced8;
        --bright: #ffffff;
        --dim: #7c8798;
        --faint: #4d5765;
        --ok: #e5ff00;
        --bad: #ff4d4d;
        --warn: #ffcc00;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
        overflow-x: hidden;
      }

      /* --- Matrix Canvas Background --- */
      #matrix {
        position: fixed;
        inset: 0;
        display: block;
        z-index: 1;
        pointer-events: none;
      }

      #brand {
        position: relative;
        z-index: 2;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(0, 10, 4, 0.85);
        backdrop-filter: blur(4px);
        text-align: center;
      }
      #brand b {
        color: var(--ok);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-shadow: 0 0 10px rgba(255, 251, 0, 0.897);
      }
      /* The live heap readout sits in the flow under the bar. */
      #ramBox {
        position: relative;
        z-index: 2;
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(5, 10, 7, 0.9);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Running: a spinner under the bar. jb.js switches the body to .done,
         .fail or .log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 15px rgba(255, 251, 0, 0.897);
        z-index: 5;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        z-index: 5;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
        color: var(--bad);
      }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255, 251, 0, 0.89);
      }
      /* ?log=1 -- the full step log. */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
        color: var(--bright);
        text-shadow: 0 0 5px rgba(245, 221, 7, 0.877);
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--panel);
        backdrop-filter: blur(6px);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
        box-shadow: inset 0 0 15px rgba(243, 207, 6, 0.87);
      }
      /* The retry notice, raised by jb.js when the chain throws or stalls. */
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid var(--bad);
        background: #2a1414;
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        z-index: 9;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code {
        color: #9fb3d0;
      }

      /* Golden Core decorative background */
      #rain,
      #core {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #rain { z-index: 1; }
      #core { z-index: 1; }
      .golden-mark {
        position: fixed;
        left: 50%;
        bottom: 8vh;
        z-index: 3;
        transform: translateX(-50%);
        padding: 0.45em 1.1em;
        border: 1px solid rgba(255, 204, 51, 0.35);
        border-radius: 4px;
        background: rgba(10, 6, 0, 0.35);
        color: #ffcc33;
        font: 12px/1.4 Consolas, "Courier New", monospace;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        white-space: nowrap;
        backdrop-filter: blur(1px);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- خلفية الماتريكس المتحركة لصفحة التنفيذ -->
    <canvas id="rain" aria-hidden="true"></canvas>
    <canvas id="core" aria-hidden="true"></canvas>
    <div class="golden-mark" aria-hidden="true">ابوسلمي</div>

    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand"><b>أبوسلمي</b></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">اعد تشغيل الكونسول</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">by ابوسلمي</p>

    <!-- تأثير Golden Core الخلفي؛ لا يتدخل في منطق التنفيذ -->
    <script>
      (() => {
        let W = 0, H = 0, CX = 0, CY = 0;

        function fitCanvas(canvas, ctx) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          canvas.style.width = W + 'px';
          canvas.style.height = H + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        const rainCanvas = document.getElementById('rain');
        const rctx = rainCanvas.getContext('2d');
        const GLYPHS =
          'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン' +
          '0123456789';

        const FONT_SIZE = 17;
        let columns = 0;
        let drops = [];
        let speeds = [];

        function resizeRain() {
          const newColumns = Math.ceil(W / FONT_SIZE);
          const newDrops = new Array(newColumns);
          const newSpeeds = new Array(newColumns);
          for (let i = 0; i < newColumns; i++) {
            newDrops[i] = drops[i] !== undefined ? drops[i] : Math.floor(Math.random() * -50);
            newSpeeds[i] = speeds[i] !== undefined ? speeds[i] : 0.25 + Math.random() * 0.55;
          }
          drops = newDrops;
          speeds = newSpeeds;
          columns = newColumns;
          rctx.fillStyle = '#030200';
          rctx.fillRect(0, 0, W, H);
        }

        function drawRain() {
          rctx.fillStyle = 'rgba(3, 2, 0, 0.08)';
          rctx.fillRect(0, 0, W, H);
          rctx.font = `${FONT_SIZE}px Consolas, "Courier New", monospace`;
          rctx.textAlign = 'center';
          const coreRadiusInfluence = Math.min(W, H) * 0.32;

          for (let i = 0; i < columns; i++) {
            const x = i * FONT_SIZE + FONT_SIZE / 2;
            const y = drops[i] * FONT_SIZE;
            const glyph = GLYPHS[(Math.random() * GLYPHS.length) | 0];
            const dx = x - CX;
            const nearCore = Math.max(0, 1 - Math.abs(dx) / coreRadiusInfluence);

            if (y > 0) {
              const headAlpha = 0.85 + nearCore * 0.15;
              rctx.fillStyle = nearCore > 0.5
                ? `rgba(255, 244, 214, ${headAlpha})`
                : `rgba(255, 215, 0, ${headAlpha})`;
              rctx.shadowColor = '#ffcc33';
              rctx.shadowBlur = 6 + nearCore * 10;
              rctx.fillText(glyph, x, y);
              rctx.shadowBlur = 0;

              if (y - FONT_SIZE > 0) {
                rctx.fillStyle = `rgba(201, 149, 12, ${0.55 + nearCore * 0.25})`;
                rctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], x, y - FONT_SIZE);
              }
            }

            const fallSpeed = speeds[i] * (1 - nearCore * 0.6);
            drops[i] += Math.max(fallSpeed, 0.08);
            if (y > H && Math.random() > 0.98) {
              drops[i] = Math.floor(Math.random() * -40);
              speeds[i] = 0.25 + Math.random() * 0.55;
            }
          }
        }

        const coreCanvas = document.getElementById('core');
        const cctx = coreCanvas.getContext('2d');
        let t = 0;
        let embers = [];

        function spawnEmber(radius) {
          return {
            angle: Math.random() * Math.PI * 2,
            radius,
            speed: 18 + Math.random() * 34,
            drift: (Math.random() - 0.5) * 0.4,
            size: 1 + Math.random() * 2,
            life: 0,
            maxLife: 2.5 + Math.random() * 2.5
          };
        }

        function resizeCore() {
          CX = W / 2;
          CY = H * 0.46;
        }

        function drawCore(dt) {
          cctx.clearRect(0, 0, W, H);
          const baseRadius = Math.min(W, H) * 0.09;
          const pulse = 1 + Math.sin(t * 1.3) * 0.06;
          const r = baseRadius * pulse;

          const ambient = cctx.createRadialGradient(CX, CY, 0, CX, CY, r * 6);
          ambient.addColorStop(0, 'rgba(255, 149, 0, 0.35)');
          ambient.addColorStop(0.35, 'rgba(255, 149, 0, 0.12)');
          ambient.addColorStop(1, 'rgba(255, 149, 0, 0)');
          cctx.fillStyle = ambient;
          cctx.fillRect(0, 0, W, H);

          const rayCount = 48;
          const rayPulse = 1 + Math.sin(t * 0.9) * 0.18;
          for (let i = 0; i < rayCount; i++) {
            const a = (i / rayCount) * Math.PI * 2 + t * 0.05;
            const jitter = Math.sin(t * 2 + i) * 0.15 + 1;
            const len = r * (2.1 + (i % 5) * 0.35) * rayPulse * jitter;
            const x1 = CX + Math.cos(a) * r * 1.02;
            const y1 = CY + Math.sin(a) * r * 1.02;
            const x2 = CX + Math.cos(a) * len;
            const y2 = CY + Math.sin(a) * len;
            const grad = cctx.createLinearGradient(x1, y1, x2, y2);
            grad.addColorStop(0, 'rgba(255, 204, 51, 0.55)');
            grad.addColorStop(1, 'rgba(255, 204, 51, 0)');
            cctx.strokeStyle = grad;
            cctx.lineWidth = i % 4 === 0 ? 1.6 : 0.8;
            cctx.beginPath();
            cctx.moveTo(x1, y1);
            cctx.lineTo(x2, y2);
            cctx.stroke();
          }

          [
            { mult: 1.5, speed: 0.4, width: 1.4, dash: [2, 10] },
            { mult: 1.9, speed: -0.27, width: 1, dash: [6, 14] }
          ].forEach(ring => {
            cctx.save();
            cctx.translate(CX, CY);
            cctx.rotate(t * ring.speed);
            cctx.beginPath();
            cctx.setLineDash(ring.dash);
            cctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
            cctx.lineWidth = ring.width;
            cctx.arc(0, 0, r * ring.mult, 0, Math.PI * 2);
            cctx.stroke();
            cctx.restore();
          });

          const core = cctx.createRadialGradient(
            CX - r * 0.25, CY - r * 0.25, r * 0.05,
            CX, CY, r
          );
          core.addColorStop(0, '#fff4d6');
          core.addColorStop(0.45, '#ffcc33');
          core.addColorStop(1, '#b8860b');
          cctx.fillStyle = core;
          cctx.beginPath();
          cctx.arc(CX, CY, r, 0, Math.PI * 2);
          cctx.fill();

          cctx.save();
          cctx.globalCompositeOperation = 'screen';
          cctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          cctx.beginPath();
          cctx.arc(CX, CY, r * 1.08, 0, Math.PI * 2);
          cctx.fill();
          cctx.restore();

          if (Math.random() > 0.65) embers.push(spawnEmber(r));
          embers.forEach(e => {
            e.life += dt;
            e.angle += e.drift * dt;
            e.radius += e.speed * dt;
          });
          embers = embers.filter(e => e.life < e.maxLife);
          embers.forEach(e => {
            const fade = 1 - e.life / e.maxLife;
            const ex = CX + Math.cos(e.angle) * e.radius;
            const ey = CY + Math.sin(e.angle) * e.radius;
            cctx.fillStyle = `rgba(255, 220, 150, ${fade * 0.8})`;
            cctx.beginPath();
            cctx.arc(ex, ey, e.size * fade, 0, Math.PI * 2);
            cctx.fill();
          });
        }

        function resizeAll() {
          W = window.innerWidth;
          H = window.innerHeight;
          fitCanvas(rainCanvas, rctx);
          fitCanvas(coreCanvas, cctx);
          resizeCore();
          resizeRain();
        }

        window.addEventListener('resize', resizeAll);
        resizeAll();

        let last = performance.now();
        function loop(now) {
          const dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          t += dt;
          drawRain();
          drawCore(dt);
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();
    </script>

    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
