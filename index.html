<!doctype html>
<html class="landing" lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>أبوسلمي</title>
    <!-- استدعاء خط عربي أصيل وعريق من جوجل (Amiri) ليعطي طابعا تراثيا فخما -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <style>
      /* ستايل الزرار بخط عتيق ولون الذهب العتيق الواضح والكبير */
      .matrix-sub-btn {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 0.85em 1.2em;
        border: 2px solid #d4af37; /* إطار بلون الذهب العتيق */
        border-radius: 8px;
        background: rgba(30, 25, 10, 0.85); /* خلفية داكنة متناسقة تبرز الذهب */
        color: #f3e5ab; /* لون اللوز الذهبي العتيق والمضيء */
        font-family: 'Amiri', serif; /* خط عربي عتيق وعريق */
        font-size: 19px; /* حجم كبير وواضح جداً */
        font-weight: 700;
        line-height: 1.5;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(212, 175, 55, 0.4); /* وهج ذهبي فخم */
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8); /* ظل للنص لزيادة الوضوح والبروز */
        transition: all 0.3s ease;
      }
      .matrix-sub-btn:hover {
        background: #d4af37;
        color: #000000;
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
        border-color: #fff;
        transform: translateY(-2px);
      }

      /* Golden Core UI palette: replace the old green accents without
         changing layout, controls, form behavior, or exploit scripts. */
      .panel {
        border-color: rgba(212, 175, 55, 0.38);
        background: rgba(12, 9, 4, 0.78);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.78),
                    0 0 22px rgba(201, 149, 12, 0.10),
                    inset 0 1px 0 rgba(255, 225, 150, 0.06);
      }
      .lede {
        color: #e8c76a;
        text-shadow: 0 0 9px rgba(212, 175, 55, 0.24);
      }
      .opt, .opt-auto {
        border: 1px solid rgba(201, 149, 12, 0.34);
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(30, 23, 9, 0.78), rgba(8, 7, 4, 0.82));
        box-shadow: inset 0 1px 0 rgba(255, 225, 150, 0.035);
        color: #d8c18a;
      }
      .opt:hover, .opt-auto:hover {
        border-color: rgba(255, 215, 120, 0.72);
        background: linear-gradient(135deg, rgba(65, 46, 12, 0.58), rgba(15, 11, 5, 0.9));
        box-shadow: 0 0 13px rgba(212, 175, 55, 0.13),
                    inset 0 0 12px rgba(212, 175, 55, 0.045);
      }
      .opt input, .opt-auto input {
        accent-color: #d4af37;
      }
      .opt span, .opt-auto span {
        color: #f0e2bd;
      }
      .btn {
        border: 1px solid #c99b2e;
        border-radius: 8px;
        background: linear-gradient(135deg, #8f6816 0%, #d4af37 48%, #9b711b 100%);
        color: #160f02;
        font-weight: 800;
        letter-spacing: 0.16em;
        box-shadow: 0 4px 18px rgba(201, 149, 12, 0.22),
                    inset 0 1px 0 rgba(255, 244, 214, 0.42);
        text-shadow: 0 1px 0 rgba(255, 235, 175, 0.22);
      }
      .btn:hover, .btn:focus {
        background: linear-gradient(135deg, #f5dc8a 0%, #d4af37 52%, #b8860b 100%);
        color: #090601;
        border-color: #f7df98;
        box-shadow: 0 0 24px rgba(255, 204, 51, 0.38),
                    inset 0 1px 0 rgba(255, 255, 235, 0.55);
        outline: none;
      }
      .count {
        color: #d8b85a;
      }

      /* Correct Golden Core stacking: canvases are background layers,
         never normal-flow elements that push the page content downward. */
      html, body {
        min-height: 100%;
        background: #030200;
      }
      #rain, #core {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        max-width: none;
        pointer-events: none;
      }
      #rain { z-index: 0; }
      #core { z-index: 1; }

      #brand {
        position: relative;
        z-index: 4;
        background: rgba(8, 6, 2, 0.72);
        border-bottom-color: rgba(212, 175, 55, 0.25);
      }
      #brand b {
        color: #e5c15b;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.32);
      }
      /* Keep the Golden Core unobstructed and dock the controls beside it. */
      .shell {
        position: fixed;
        inset: 45px 0 0;
        z-index: 3;
        display: block;
        min-height: 0;
        padding: 0;
        pointer-events: none;
      }
      .panel {
        position: absolute;
        top: 50%;
        right: clamp(18px, 4.5vw, 76px);
        transform: translateY(-50%);
        width: min(310px, 28vw);
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        padding: 21px;
        border: 1px solid rgba(226, 185, 75, 0.58);
        border-radius: 16px;
        background: linear-gradient(145deg, rgba(25, 18, 5, 0.91), rgba(5, 4, 2, 0.88));
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.62),
                    0 0 26px rgba(212, 175, 55, 0.17),
                    inset 0 1px 0 rgba(255, 230, 160, 0.13);
        backdrop-filter: blur(12px);
        pointer-events: auto;
      }
      .panel::before {
        content: "";
        display: block;
        width: 54px;
        height: 3px;
        margin: -2px auto 15px;
        border-radius: 99px;
        background: linear-gradient(90deg, transparent, #e4bd57, transparent);
        box-shadow: 0 0 12px rgba(228, 189, 87, 0.55);
      }
      .lede {
        margin-bottom: 1.1em;
        font-size: 13px;
      }
      .pick {
        display: grid;
        gap: 9px;
      }
      .opt, .opt-auto {
        margin: 0;
        padding: 11px 13px;
      }
      .btn {
        margin-top: 4px;
        padding: 0.95em 1.2em;
      }
      .matrix-sub-btn {
        margin-top: 5px;
        font-size: 16px;
      }
      .meme {
        position: absolute;
        top: 50%;
        left: clamp(18px, 5vw, 82px);
        transform: translateY(-50%);
        width: min(210px, 22vw);
        max-width: 24vw;
        z-index: 3;
        pointer-events: auto;
      }
      .golden-mark {
        position: fixed;
        z-index: 3;
        left: 50%;
        bottom: 8vh;
        transform: translateX(-50%);
        padding: 0.45em 1.1em;
        border: 1px solid rgba(255, 204, 51, 0.35);
        border-radius: 4px;
        background: rgba(10, 6, 0, 0.42);
        color: #ffcc33;
        font: 12px/1.4 Consolas, "Courier New", monospace;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        white-space: nowrap;
        backdrop-filter: blur(2px);
        pointer-events: none;
      }
      .byline {
        z-index: 5;
        color: rgba(216, 184, 90, 0.72);
      }
      @media (max-width: 700px) {
        .shell {
          inset: 42px 0 0;
        }
        .panel {
          top: auto;
          right: 12px;
          bottom: 14px;
          transform: none;
          width: min(270px, calc(100vw - 24px));
          max-height: 44vh;
          padding: 14px;
          border-radius: 13px;
        }
        .panel::before {
          margin-bottom: 9px;
        }
        .lede {
          margin-bottom: 0.75em;
          font-size: 11px;
        }
        .opt, .opt-auto {
          padding: 8px 10px;
          font-size: 12px;
        }
        .btn {
          padding: 0.78em 1em;
        }
        .matrix-sub-btn {
          padding: 0.55em 0.8em;
          font-size: 13px;
          line-height: 1.35;
        }
        .meme {
          top: 43%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: min(150px, 40vw);
          max-width: 40vw;
        }
        .golden-mark {
          bottom: calc(44vh + 22px);
          font-size: 9px;
        }
      }

      /* Final clean composition: controls float freely; only the service
         statement gets its own wide gold frame below the core. */
      html, body {
        width: 100%;
        min-height: 100%;
        overflow: hidden;
        scrollbar-width: none;
      }
      body::-webkit-scrollbar,
      html::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      .shell {
        position: fixed;
        inset: 45px 0 0;
        z-index: 4;
        pointer-events: none;
      }
      .panel {
        position: absolute;
        top: 46%;
        right: clamp(24px, 5vw, 90px);
        transform: translateY(-50%);
        width: min(330px, 30vw);
        max-height: none;
        overflow: visible;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        pointer-events: auto;
      }
      .panel::before {
        display: none;
        content: none;
      }
      .lede {
        margin: 0 0 20px;
        color: #f2d47b;
        font-size: clamp(17px, 1.45vw, 21px);
        line-height: 1.5;
        font-weight: 700;
        text-shadow: 0 0 12px rgba(226, 185, 75, 0.38);
        text-align: center;
      }
      .pick {
        display: grid;
        gap: 13px;
        overflow: visible;
      }
      .opt, .opt-auto {
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 0;
        padding: 12px 15px;
        border: 1px solid rgba(220, 179, 75, 0.48);
        border-radius: 9px;
        background: rgba(8, 6, 2, 0.28);
        color: #f4e6bd;
        font-size: clamp(16px, 1.3vw, 19px);
        line-height: 1.45;
        box-shadow: 0 0 12px rgba(212, 175, 55, 0.08);
      }
      .opt span, .opt-auto span {
        color: #fff0c5;
        font-size: inherit;
        font-weight: 700;
        text-shadow: 0 1px 5px #000, 0 0 8px rgba(212, 175, 55, 0.22);
      }
      .opt input, .opt-auto input {
        width: 19px;
        height: 19px;
        flex: 0 0 19px;
        accent-color: #e0b83f;
      }
      .btn {
        min-height: 48px;
        margin-top: 2px;
        padding: 10px 22px;
        border: 1px solid #f1d47a;
        border-radius: 9px;
        background: linear-gradient(135deg, #a87916, #f0d477 52%, #a87916);
        color: #130d02;
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 0.13em;
        box-shadow: 0 5px 22px rgba(212, 175, 55, 0.22);
      }
      .count {
        margin: 0;
        color: #f0d477;
        font-size: 16px;
        text-shadow: 0 1px 5px #000;
      }
      .matrix-sub-btn {
        position: fixed;
        z-index: 6;
        left: 50%;
        bottom: clamp(24px, 6vh, 58px);
        transform: translateX(-50%);
        display: block;
        width: max-content;
        max-width: min(94vw, 1100px);
        margin: 0;
        padding: 15px 34px;
        border: 2px solid rgba(239, 202, 103, 0.9);
        border-radius: 13px;
        background: linear-gradient(100deg, rgba(24, 16, 3, 0.9), rgba(75, 52, 10, 0.86), rgba(24, 16, 3, 0.9));
        color: #ffe7a0;
        font-family: 'Amiri', serif;
        font-size: clamp(19px, 1.7vw, 25px);
        font-weight: 700;
        line-height: 1.5;
        text-align: center;
        text-decoration: none;
        white-space: nowrap;
        text-shadow: 0 2px 5px #000, 0 0 12px rgba(255, 207, 86, 0.35);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.48),
                    0 0 22px rgba(212, 175, 55, 0.22),
                    inset 0 1px 0 rgba(255, 238, 190, 0.18);
        pointer-events: auto;
      }
      .matrix-sub-btn:hover {
        transform: translateX(-50%) translateY(-2px);
        border-color: #fff0b7;
        background: linear-gradient(100deg, rgba(66, 46, 8, 0.95), rgba(145, 104, 19, 0.92), rgba(66, 46, 8, 0.95));
        color: #fff5d7;
      }
      .golden-mark {
        display: none;
      }
      .byline {
        position: fixed;
        z-index: 6;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        color: rgba(238, 205, 119, 0.9);
        font-size: 15px;
        text-shadow: 0 1px 6px #000;
        white-space: nowrap;
        pointer-events: none;
      }
      @media (max-width: 700px) {
        html, body {
          overflow: hidden;
        }
        .shell {
          inset: 42px 0 0;
        }
        .panel {
          top: 20px;
          right: 12px;
          transform: none;
          width: min(225px, 58vw);
        }
        .lede {
          margin-bottom: 12px;
          font-size: 15px;
        }
        .pick {
          gap: 8px;
        }
        .opt, .opt-auto {
          padding: 8px 9px;
          gap: 7px;
          font-size: 14px;
        }
        .opt input, .opt-auto input {
          width: 16px;
          height: 16px;
          flex-basis: 16px;
        }
        .btn {
          min-height: 42px;
          padding: 8px 16px;
          font-size: 17px;
        }
        .matrix-sub-btn {
          bottom: 18px;
          width: calc(100vw - 24px);
          max-width: none;
          padding: 10px 12px;
          font-size: 16px;
          line-height: 1.45;
          white-space: normal;
        }
        .byline {
          top: 8px;
          font-size: 12px;
        }
      }

    </style>
  </head>
  <body>
    <!-- خلفية الماتريكس المتحركة -->
    <canvas id="rain" aria-hidden="true"></canvas>
    <canvas id="core" aria-hidden="true"></canvas>
    <div class="golden-mark" aria-hidden="true">golden core</div>

    <!-- Every run starts from here. The referrer guard in jb.js arms the chain
         only when it was reached from this page, so that a browser restoring
         its last session cannot re-run it unattended. -->
    <div id="brand"><b></b></div>

    <div class="shell">
      <img class="meme" src="meme.png" alt="" />

      <main class="panel">
        <p class="lede">صل على حبيبك النبي  &middot; سوفت 14.00</p>

        <form class="pick" id="pick">
          
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>تحميل تلقائي</span>
          </label>

          <button class="btn" type="submit">start</button>
          
          <!-- الزرار الإضافي بخط عربي عتيق ولون الذهب العتيق وبحجم كبير -->

          <p class="count" id="count"></p>
        </form>
      </main>

      <a href="#" class="matrix-sub-btn">ابوزين لصيانه الاجهزة والدراعات وتنزيل ألعاب البلايستيشن 4 و 5</a>
    </div>

    <p class="byline">أبوزيـــن 01279227123</p>

    <!-- تأثير Golden Core الخلفي؛ لا يتدخل في منطق التشغيل -->
    <script>
      (() => {
        let W = 0, H = 0, CX = 0, CY = 0;

        function fitCanvas(canvas, ctx) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          canvas.style.width = W + 'px';
          canvas.style.height = H + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        const rainCanvas = document.getElementById('rain');
        const rctx = rainCanvas.getContext('2d');
        const GLYPHS =
          'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン' +
          '0123456789';

        const FONT_SIZE = 17;
        let columns = 0;
        let drops = [];
        let speeds = [];

        function resizeRain() {
          const newColumns = Math.ceil(W / FONT_SIZE);
          const newDrops = new Array(newColumns);
          const newSpeeds = new Array(newColumns);
          for (let i = 0; i < newColumns; i++) {
            newDrops[i] = drops[i] !== undefined ? drops[i] : Math.floor(Math.random() * -50);
            newSpeeds[i] = speeds[i] !== undefined ? speeds[i] : 0.25 + Math.random() * 0.55;
          }
          drops = newDrops;
          speeds = newSpeeds;
          columns = newColumns;
          rctx.fillStyle = '#030200';
          rctx.fillRect(0, 0, W, H);
        }

        function drawRain() {
          rctx.fillStyle = 'rgba(3, 2, 0, 0.08)';
          rctx.fillRect(0, 0, W, H);
          rctx.font = `${FONT_SIZE}px Consolas, "Courier New", monospace`;
          rctx.textAlign = 'center';
          const coreRadiusInfluence = Math.min(W, H) * 0.32;

          for (let i = 0; i < columns; i++) {
            const x = i * FONT_SIZE + FONT_SIZE / 2;
            const y = drops[i] * FONT_SIZE;
            const glyph = GLYPHS[(Math.random() * GLYPHS.length) | 0];
            const dx = x - CX;
            const nearCore = Math.max(0, 1 - Math.abs(dx) / coreRadiusInfluence);

            if (y > 0) {
              const headAlpha = 0.85 + nearCore * 0.15;
              rctx.fillStyle = nearCore > 0.5
                ? `rgba(255, 244, 214, ${headAlpha})`
                : `rgba(255, 215, 0, ${headAlpha})`;
              rctx.shadowColor = '#ffcc33';
              rctx.shadowBlur = 6 + nearCore * 10;
              rctx.fillText(glyph, x, y);
              rctx.shadowBlur = 0;

              if (y - FONT_SIZE > 0) {
                rctx.fillStyle = `rgba(201, 149, 12, ${0.55 + nearCore * 0.25})`;
                rctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], x, y - FONT_SIZE);
              }
            }

            const fallSpeed = speeds[i] * (1 - nearCore * 0.6);
            drops[i] += Math.max(fallSpeed, 0.08);
            if (y > H && Math.random() > 0.98) {
              drops[i] = Math.floor(Math.random() * -40);
              speeds[i] = 0.25 + Math.random() * 0.55;
            }
          }
        }

        const coreCanvas = document.getElementById('core');
        const cctx = coreCanvas.getContext('2d');
        let t = 0;
        let embers = [];

        function spawnEmber(radius) {
          return {
            angle: Math.random() * Math.PI * 2,
            radius,
            speed: 18 + Math.random() * 34,
            drift: (Math.random() - 0.5) * 0.4,
            size: 1 + Math.random() * 2,
            life: 0,
            maxLife: 2.5 + Math.random() * 2.5
          };
        }

        function resizeCore() {
          CX = W / 2;
          CY = H * 0.46;
        }

        function drawCore(dt) {
          cctx.clearRect(0, 0, W, H);
          const baseRadius = Math.min(W, H) * 0.09;
          const pulse = 1 + Math.sin(t * 1.3) * 0.06;
          const r = baseRadius * pulse;

          const ambient = cctx.createRadialGradient(CX, CY, 0, CX, CY, r * 6);
          ambient.addColorStop(0, 'rgba(255, 149, 0, 0.35)');
          ambient.addColorStop(0.35, 'rgba(255, 149, 0, 0.12)');
          ambient.addColorStop(1, 'rgba(255, 149, 0, 0)');
          cctx.fillStyle = ambient;
          cctx.fillRect(0, 0, W, H);

          const rayCount = 48;
          const rayPulse = 1 + Math.sin(t * 0.9) * 0.18;
          for (let i = 0; i < rayCount; i++) {
            const a = (i / rayCount) * Math.PI * 2 + t * 0.05;
            const jitter = Math.sin(t * 2 + i) * 0.15 + 1;
            const len = r * (2.1 + (i % 5) * 0.35) * rayPulse * jitter;
            const x1 = CX + Math.cos(a) * r * 1.02;
            const y1 = CY + Math.sin(a) * r * 1.02;
            const x2 = CX + Math.cos(a) * len;
            const y2 = CY + Math.sin(a) * len;
            const grad = cctx.createLinearGradient(x1, y1, x2, y2);
            grad.addColorStop(0, 'rgba(255, 204, 51, 0.55)');
            grad.addColorStop(1, 'rgba(255, 204, 51, 0)');
            cctx.strokeStyle = grad;
            cctx.lineWidth = i % 4 === 0 ? 1.6 : 0.8;
            cctx.beginPath();
            cctx.moveTo(x1, y1);
            cctx.lineTo(x2, y2);
            cctx.stroke();
          }

          [
            { mult: 1.5, speed: 0.4, width: 1.4, dash: [2, 10] },
            { mult: 1.9, speed: -0.27, width: 1, dash: [6, 14] }
          ].forEach(ring => {
            cctx.save();
            cctx.translate(CX, CY);
            cctx.rotate(t * ring.speed);
            cctx.beginPath();
            cctx.setLineDash(ring.dash);
            cctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
            cctx.lineWidth = ring.width;
            cctx.arc(0, 0, r * ring.mult, 0, Math.PI * 2);
            cctx.stroke();
            cctx.restore();
          });

          const core = cctx.createRadialGradient(
            CX - r * 0.25, CY - r * 0.25, r * 0.05,
            CX, CY, r
          );
          core.addColorStop(0, '#fff4d6');
          core.addColorStop(0.45, '#ffcc33');
          core.addColorStop(1, '#b8860b');
          cctx.fillStyle = core;
          cctx.beginPath();
          cctx.arc(CX, CY, r, 0, Math.PI * 2);
          cctx.fill();

          cctx.save();
          cctx.globalCompositeOperation = 'screen';
          cctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          cctx.beginPath();
          cctx.arc(CX, CY, r * 1.08, 0, Math.PI * 2);
          cctx.fill();
          cctx.restore();

          if (Math.random() > 0.65) embers.push(spawnEmber(r));
          embers.forEach(e => {
            e.life += dt;
            e.angle += e.drift * dt;
            e.radius += e.speed * dt;
          });
          embers = embers.filter(e => e.life < e.maxLife);
          embers.forEach(e => {
            const fade = 1 - e.life / e.maxLife;
            const ex = CX + Math.cos(e.angle) * e.radius;
            const ey = CY + Math.sin(e.angle) * e.radius;
            cctx.fillStyle = `rgba(255, 220, 150, ${fade * 0.8})`;
            cctx.beginPath();
            cctx.arc(ex, ey, e.size * fade, 0, Math.PI * 2);
            cctx.fill();
          });
        }

        function resizeAll() {
          W = window.innerWidth;
          H = window.innerHeight;
          fitCanvas(rainCanvas, rctx);
          fitCanvas(coreCanvas, cctx);
          resizeCore();
          resizeRain();
        }

        window.addEventListener('resize', resizeAll);
        resizeAll();

        let last = performance.now();
        function loop(now) {
          const dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          t += dt;
          drawRain();
          drawCore(dt);
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();
    </script>
        <script src="launch.js"></script>
  </body>
</html>
